name: Eldonado

# Aŭtomata eldonado de EsperantoRadio al Google Play
# Dokumentaro: docs/nova/07_eldonado.md
#
# Trigas: git-etikedo kiel "v3.0.1"
# Postulataj sekretaj variabloj (Settings → Secrets → Actions):
#   KEYSTORE_BASE64          — base64-kodita keystore-dosiero
#   KEYSTORE_PASSWORD        — keystore-pasvorto
#   KEYSTORE_ALIAS           — ŝlosila alinomo
#   KEYSTORE_KEY_PASSWORD    — ŝlosila pasvorto
#   PLAY_SERVICE_ACCOUNT_JSON — JSON-enhavo de Play Console servila konto
#
# F-Droid ne estas ĉi tie — ĝi konstruas mem el la git-etikedo.

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Agordu JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Agordu keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/keystore.jks
          echo "KEYSTORE_PATH=$HOME/keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }}" >> $GITHUB_ENV
          echo "KEYSTORE_KEY_PASSWORD=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Agordu Play Console servilan konton
        run: |
          echo '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > $HOME/play-service-account.json
          echo "PLAY_SERVICE_ACCOUNT_JSON_PATH=$HOME/play-service-account.json" >> $GITHUB_ENV

      - name: Publikigu APK-on al Google Play (internal track)
        # APK, ne AAB: la apo ne estas enskribita en Play App Signing,
        # kaj AAB-alŝuto postulas tion (403 "must be enrolled in Play Signing").
        run: ./gradlew :androidApp:publishReleaseApk

      - name: Alŝutu APK kiel artefakto (por permana alŝuto al Aptoide)
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 30
