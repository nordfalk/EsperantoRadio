# Testoj kaj konstruo por ĉiu PR kaj push al master (FAROTA G24).
#
# Antaŭe neniu CI rulis testojn aŭ konstruon por PR-oj — nur changelog-kontrolo kaj
# la eldona laborfluo (kiu konstruas nur ĉe etikedo, do tro malfrue). Tiel:
# - PR #79 enmetis `Dispatchers.IO` en commonMain kaj ROMPIS la wasmJs-kompiladon
#   (IO ne ekzistas sur wasmJs) — nekaptita, ĉar neniu laborfluo kompilis wasmJs.
# - PR #81 pasis CI sed rompis `androidApp/build.gradle.kts`.
#
# La instrumentitaj testoj (connectedDebugAndroidTest) restas neaŭtomataj —
# ili bezonas emulilon kaj estas rulataj mane (vidu AGENTS.md).
#
# (2026-10-31, rapidigo de la CI): por ne devi atendi longe por ĉiu puŝo —
#  1. UNU Gradle-voko anstataŭ kvar (unu konfigurado/daemon);
#  2. la Gradle-build-kaŝo estas persistata (actions/cache + org.gradle.caching=true),
#     do neŝanĝitaj taskoj ne rekompiliĝas (enhave hakitaj enigoj: fontoŝanĝo
#     malvalidigas nur la tuŝitajn modulojn);
#  3. `concurrency` kun cancel-in-progress: nova puŝo al la sama branĉo nuligas
#     la kurantan runon — oni atendas nur la lastan.
name: testoj-kaj-konstruo

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testoj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Agordu JDK 17 (JDK 17 estas necesa por la Android-konstruo)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # (2) Persisti la Gradle-build-kaŝon (task-eliroj), ne nur la dependencojn.
      # La ŝlosilo dependas de la build-dosieroj; restore-keys permesas reuzi
      # trans malgrandaj ŝanĝoj — la enhavo-hakoj interne prizorgas la reston.
      - name: Kaŝo de la Gradle-build-kaŝo
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', '**/build.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-build-cache-

      # (1) Unu Gradle-voko: unu konfigurado kaj unu daemon por ĉiuj taskoj
      - name: Testoj + kompil-kontroloj (unu Gradle-voko)
        run: ./gradlew :shared:desktopTest :desktopApp:compileKotlinDesktop :androidApp:assembleDebug :shared:compileKotlinWasmJs
