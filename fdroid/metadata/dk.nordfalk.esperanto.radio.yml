  dana DR Radio-apo (GPL).

Summary:en-US: Radio with 27 Esperanto channels and podcasts, from around the world
Description:en-US: |-
  Listen to Esperanto — 27 radio channels and podcasts from around the
  world in one app: channel overview, live streams, podcasts, downloads,
  favourites, search and an alarm clock.

  The app is built with Compose Multiplatform and is a fork of the Danish
  DR Radio app (GPL).

RepoType: git
