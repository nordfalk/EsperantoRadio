# Konstru-instrukcioj — F-Droid konstruas la APOKON mem el la etikedita fonto:
# fdroid rulas `gradlew-fdroid assembleRelease` en `androidApp/` (subdir).
# gradlew-fdroid legas `gradle/wrapper/gradle-wrapper.properties` (serĉas ankaŭ
# en la gepatra dosierujo — la radiko), elŝutas Gradle 9.8.1 kun SHA-256-kontrolo
# kaj plenumas `assembleRelease`, kiu el `androidApp/` solviĝas kiel
# `:androidApp:assembleRelease` (kontrolita 2026-10-29).
# Signado: la release-buildtype subskribas NUR se la keystore-dosiero ekzistas —
# sur la F-Droid-buildservilo ĝi mankas, do la APK eldoniĝas nesubskribita kaj
# F-Droid subskribas ĝin per sia propra ŝlosilo.
Builds:
  - versionName: '3.1.0'
    versionCode: 252
    commit: v3.1.0
    subdir: androidApp
    gradle:
      - yes

# Aŭtomata ĝisdatigo: nova git-etikedo `vX.Y.Z` → nova F-Droid-konstruo.
# La ŝablono `v%v` generas la etikedo-nomon el la versio-nomo.
AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 3.1.0
CurrentVersionCode: 252

# Sentry-konsidero (C50, solvita en PR #148):
# F-Droid konstruas SEN nia keystore (vidu la signadon en androidApp/
# build.gradle.kts) — en tiaj konstruoj la erar-raportado al sentry.io estas
# OPT-IN: defaŭlte malŝaltita, unufoja konsento-demando ĉe la unua starto
# (ŝanĝebla en Agordoj → Privateco). Laŭ la F-Droid-lingvaĵo ne temas pri la
# kontraŭeco "Tracking" (https://f-droid.org/en/docs/Anti-Features/ — "opt-in
# kaj defaŭlte malŝaltita" estas eksplicite la kondiĉo SEN la kontraŭeco).
# Konstruoj KUN nia subskribo (kiujn ni mem disdonas: Google Play, Aptoide)
# raportas defaŭlte — tio ne koncernas la F-Droid-konstruon, ĉar F-Droid ĉiam
# subskribas per SIA propra ŝlosilo kaj la apo rekonas tion (BuildConfig.
# SEN_NIA_SUBSKRIBO). Se la MR-kontrolisto demandas, referencu la
# konsento-dialogon en shared/.../App.kt.
#
# Reprodukteblaj konstruoj (opcia, ne bezonata por enigo):
# se `dependenciesInfo { includeInApk = false }` estos agordita kaj la konstruo
# estos bit-identa, F-Droid povas validigi kaj disdoni NIAN subskribitan APK-on
# (sen re-instalo inter F-Droid- kaj GitHub-uzantoj). Tiam aldonu ĉi tie:
# AllowedAPKSigningKeys: aab92d2bb6401743128fbe641ff86a0875ca95cb2cc5e15b1d4a7cd5e534eb16
# (SHA-256 de la subskriba atestilo, eldonita per
#  apksigner verify --print-certs androidApp-release.apk)
