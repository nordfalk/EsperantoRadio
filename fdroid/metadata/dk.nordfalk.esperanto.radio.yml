# F-Droid-metadateno por EsperantoRadio
#
# Ĉi tiu dosiero estas laŭ la nuna fdroiddata-formato (Build Metadata Reference:
# https://f-droid.org/docs/Build_Metadata_Reference/) kaj rekte submetebla.
# Procedo (2026-10-29, C50):
# 1. Kreu GitLab-konton (aŭ uzu ekzistan) ĉe https://gitlab.com
# 2. Forku https://gitlab.com/fdroid/fdroiddata
# 3. Kopiu ĉi tiun dosieron al fdroiddata/metadata/dk.nordfalk.esperanto.radio.yml
#    (branĉo nomata laŭ la apo-identigilo)
# 4. Kreu merge request al fdroid/fdroiddata — la GitLab-CI de fdroiddata
#    aŭtomate provas konstrui (rigardu ĝian eligilon!)
# 5. La F-Droid-teamo revizias; la MR-kontrolistoj petas eventuale
#    AntiFeatures-eraron aŭ priskribo-ĝustigojn
#
# Grave por ĉiu nova versio (Builds-ero + la 3 kampoj malsupre):
# - git-etikedo `vX.Y.Z` sur master (F-Droid konstruas EL LA ETIKEDO)
# - versionCode en androidApp/build.gradle.kts kongrua
# - apoversio en gradle/libs.versions.toml kongrua
# - ĉe ŝanĝo de build-ordo: kontroli ke `cd androidApp && gradlew assembleRelease`
#   funkcias SEN secrets.properties (nesubskribita konstruo — F-Droid subskribas mem)

