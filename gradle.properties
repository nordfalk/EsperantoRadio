# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# For at få RobolectricGradleTestRunner til at virke - 10. nov 2017
# android.enableAapt2=false

# Fra migrering til androidX
android.useAndroidX=true
# La malnova apo uzas risurcojn de dependencoj (ekz. abc_ic_ab_back_material de appcompat)
# — trans-depresa R-klaso devas resti ŝaltita
android.nonTransitiveRClass=false
android.suppressUnsupportedCompileSdk=37

# AGP 9: la nova DSL ne kongruas kun KMP-androidTarget() — provizora pretervojo
# (laŭ la rekomendo de la erarmesaĝo; vidu https://kotl.in/gradle/agp-new-kmp)
android.newDsl=false
# AGP 9: enmetita Kotlin (built-in) konfliktas kun KGP en KMP-moduloj — malŝaltu
# (https://developer.android.com/build/migrate-to-built-in-kotlin)
android.builtInKotlin=false

# KMP / Compose Multiplatform
kotlin.code.style=official
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.uikit.enabled=true
