<!DOCTYPE html>
<html lang="eo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EsperantoRadio beta (ne finpreta)</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
        #ComposeTarget { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <div id="ComposeTarget"></div>

    <!--
      Erar-raportado (Sentry) por la reta versio.
      La KMP-SDK ne ekzistas por wasmJs (ĝi estas no-op tie), tial la paĝo ŝargas
      la Sentry-JavaScript-SDK-n kaj la KMP-kodo parolas al ĝi per la window.ert-ponto
      (vidu SentryPonto.wasmJs.kt).

      Ordo gravas: la konsento legiĝas ANTAŬ la SDK, por ke ankaŭ la sendependaj
      JS-eraroj (window.onerror k.a.) respektu ĝin per beforeSend.
    -->
    <script>
        window.erarRaportadoAktiva = true;
        try {
            // SettingsKeys.ERAR_RAPORTADO — persistas en localStorage (StorageSettings)
            if (localStorage.getItem("erar_raportado") === "false") window.erarRaportadoAktiva = false;
        } catch (e) {
            // localStorage rifuzita (sekurecaj agordoj de la retumilo) — restu ĉe la defaŭlto
        }
        // Nur la produktada retejo raportas — loka evoluado ne polu Sentry
        window.sentryEblas =
            location.hostname === "javabog.dk" || location.hostname === "www.javabog.dk";
    </script>

    <!-- Sentry-JavaScript-SDK (la DSN kongruas kun SentryAgordo.kt). La versio
         enmetiĝas de kopiuAlPublikaElsutejo (webApp/build.gradle.kts) anstataŭ
         __APOVERSIIO__. -->
    <script src="https://cdn.jsdelivr.net/npm/@sentry/browser@10/dist/bundle.min.js" crossorigin="anonymous"></script>

    <script>
        if (window.sentryEblas && window.Sentry) {
            Sentry.init({
                dsn: "https://764998823a401d936a5e227d1453951e@o4512078664564736.ingest.de.sentry.io/4512078868185168",
                release: "esperantoradio@__APOVERSIIO__",
                environment: "produktado",
                // Erar-eventoj 50 %-specimenataj — same kiel Android (PR #109, G46)
                sampleRate: 0.5,
                // Sentry.logger.* (protokoloj) — aparta kvoto, ne la erarojn-kvoto
                _experiments: { enableLogs: true },
                beforeSend: function (event) {
                    return window.erarRaportadoAktiva ? event : null;
                }
            });
        }

        // Ponto por la KMP-kodo. Ĉiuj funkcioj estas sendanĝeraj ankaŭ kiam
        // la SDK mankas (evolua rulado, blokiloj): simple nenio okazas.
        window.ert = {
            // nivelo: "info" | "warn" | "error"  → Sentry logs
            protokolo: function (level, msg) {
                if (!window.sentryEblas || !window.erarRaportadoAktiva || !window.Sentry) return;
                var s = window.Sentry, l = s.logger;
                if (!l) return; // malnova SDK sen protokoloj — prefere silenti ol eraro-eventojn plenigi
                if (level === "warn") l.warn(msg);
                else if (level === "error") l.error(msg);
                else l.info(msg);
            },
            // Vera eraro → error-evento (konsumas la monatan erarojn-kvoton)
            escepto: function (msg, stack) {
                if (!window.sentryEblas || !window.erarRaportadoAktiva || !window.Sentry) return;
                var err = new Error(msg);
                if (stack) err.stack = msg + "\n" + stack;
                window.Sentry.captureException(err);
            },
            etikedo: function (key, value) {
                if (!window.sentryEblas || !window.Sentry) return;
                window.Sentry.setTag(key, value);
            },
            // Konsento-ŝanĝo dum la rulado (Agordoj → Privateco)
            konsento: function (active) {
                window.erarRaportadoAktiva = !!active;
            }
        };
    </script>

    <script src="webApp.js"></script>
</body>
</html>
